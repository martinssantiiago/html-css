<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
     * {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        box-sizing: border-box;
     }

     body {
        background-color: lightcoral;
     }

     main {
        background-color: lightblue;
        height: 100vh;
        width: 100vw;
        justify-content: center;
        align-items: center;

        display: flex;
     }

     section {
        background-color: rgb(252, 252, 252);
        height: 300px;
        width: 300px;
        
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.356);
     }

     section > h1 {
        text-align: center;
        margin-top: 10px;
     }

     input {
        padding: 10px;
        margin-top: 20px;
        border-radius: 10px;
        border: 1px solid black;
     }
      label {
        padding: 10px;
      }

      input.enviar {
        width: 90%;
        display: inline-block;
        margin-left: 10px;
      }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>login</h1>
            <form action="cadastro.php" method="post"autocomplete="on">
               <label for="ilogin">Usuario:</label>
               <input type="email" name="login" id="ilogin" autocomplete="email" required minlength="12" maxlength="30" placeholder="coloque seu email">

               <input class="enviar" type="submit" value="enviar">
               <input class="enviar" type="reset" value="deletar">
            </form>
        </section>
    </main>
</body>
</html>
